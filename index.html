*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#080c14;min-height:100vh;display:flex;justify-content:center;font-family:'Inter',sans-serif;color:#f1f5f9;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px;}
input,select,button{font-family:'Inter',sans-serif;}
input::placeholder{color:#334155;}
select option{background:#0f172a;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fireAnim{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}

@keyframes lvlUp{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes bell{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>

// ── DESIGN TOKENS ──────────────────────────────────────────────────
let C={
  bg:"#080c14",
  surface:"#0f172a",
  card:"#111827",
  border:"#1e2d3d",

function applyTheme(themeId){

// ── UI PRIMITIVES ──────────────────────────────────────────────────
const card=(extra={})=>({background:C.card,borderRadius:16,border:`1px solid ${C.border}`,padding:"14px 16px",...extra});

function Tag({color,children}){
  return React.createElement('span',{style:{background:color+"18",color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:500}},children);
}

function Ring({value,max,color,size=76,label,unit}){
  const r=(size-10)/2,circ=2*Math.PI*r,pct=Math.min(value/max,1),offset=circ*(1-pct);
  return React.createElement('div',{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:6}},
    React.createElement('svg',{width:size,height:size},
      React.createElement('circle',{cx:size/2,cy:size/2,r,fill:"none",stroke:"#1e293b",strokeWidth:8}),
      React.createElement('circle',{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:8,strokeDasharray:circ,strokeDashoffset:offset,strokeLinecap:"round",transform:`rotate(-90 ${size/2} ${size/2})`,style:{transition:"stroke-dashoffset .5s ease"}}),
      React.createElement('text',{x:size/2,y:size/2+5,textAnchor:"middle",fill:"#f1f5f9",fontSize:13,fontWeight:"700"},value)
    ),
    React.createElement('div',{style:{textAlign:"center"}},
      React.createElement('div',{style:{fontSize:11,color:C.muted}},label),
      React.createElement('div',{style:{fontSize:10,color,fontWeight:600}},unit)
    )
  );
}

// ── AUTH SCREEN ────────────────────────────────────────────────────
function AuthScreen({onSkip}){
  const[mode,setMode]=useState("login");
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[pw2,setPw2]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const submit=async()=>{
    setError("");
    if(!email||!pw){setError("Bitte E-Mail und Passwort eingeben.");return;}
    if(mode==="register"&&pw!==pw2){setError("Passwörter stimmen nicht überein.");return;}
    if(pw.length<6){setError("Passwort: mindestens 6 Zeichen.");return;}
    setLoading(true);
    try{
      if(mode==="register")await window.__fb.createUser(email,pw);
      else await window.__fb.signIn(email,pw);
    }catch(e){
      const m={"auth/email-already-in-use":"E-Mail bereits registriert.","auth/invalid-email":"Ungültige E-Mail.","auth/wrong-password":"Falsches Passwort.","auth/user-not-found":"Kein Konto gefunden.","auth/invalid-credential":"E-Mail oder Passwort falsch."};
      setError(m[e.code]||"Fehler: "+e.message);
    }
    setLoading(false);
  };

  return React.createElement('div',{style:{width:"100%",maxWidth:420,minHeight:"100vh",margin:"0 auto",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 20px",background:C.bg}},
    React.createElement('div',{style:{fontSize:40,marginBottom:12}},"🌙"),
    React.createElement('div',{style:{fontSize:26,fontWeight:800,color:C.text,marginBottom:4}},"LifeApp"),
    React.createElement('div',{style:{fontSize:13,color:C.muted,marginBottom:36}},"Dein täglicher Begleiter"),

    React.createElement('div',{style:{...card(),width:"100%",padding:"24px"}},
      React.createElement('div',{style:{display:"flex",background:C.surface,borderRadius:10,padding:3,marginBottom:20}},
        ["login","register"].map(m=>React.createElement('button',{key:m,onClick:()=>{setMode(m);setError("");},style:{flex:1,background:mode===m?C.accent:"transparent",color:mode===m?"#fff":C.muted,border:"none",borderRadius:8,padding:"8px",fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .2s"}},m==="login"?"Anmelden":"Registrieren"))
      ),
      React.createElement('input',{style:{...inp(),marginBottom:10},type:"email",placeholder:"E-Mail",value:email,onChange:e=>setEmail(e.target.value)}),
      React.createElement('input',{style:{...inp(),marginBottom:mode==="register"?10:16},type:"password",placeholder:"Passwort",value:pw,onChange:e=>setPw(e.target.value),onKeyDown:e=>e.key==="Enter"&&submit()}),
      mode==="register"&&React.createElement('input',{style:{...inp(),marginBottom:16},type:"password",placeholder:"Passwort wiederholen",value:pw2,onChange:e=>setPw2(e.target.value)}),
      error&&React.createElement('div',{style:{background:"#f43f5e12",border:"1px solid #f43f5e33",borderRadius:8,padding:"8px 12px",color:"#f43f5e",fontSize:12,marginBottom:12}},error),
      React.createElement('button',{onClick:submit,disabled:loading,style:{...btn(`linear-gradient(135deg,${C.accent},${C.accent2})`),width:"100%",padding:"12px",fontSize:14,marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:loading?.7:1}},
        loading&&React.createElement('div',{style:{width:14,height:14,border:"2px solid #ffffff44",borderTop:"2px solid #fff",borderRadius:"50%",animation:"spin .8s linear infinite"}}),
        mode==="login"?"Anmelden →":"Konto erstellen →"
      ),
      React.createElement('button',{onClick:onSkip,style:{...btn("transparent"),width:"100%",color:C.muted,border:`1px solid ${C.border}`,padding:"10px",fontSize:12}},"Ohne Konto fortfahren (lokal)")
    ),
    React.createElement('div',{style:{marginTop:16,fontSize:11,color:C.subtle,textAlign:"center",lineHeight:1.8}},
      "Ohne Konto: nur auf diesem Gerät gespeichert",React.createElement('br'),"Mit Konto: auf allen Geräten verfügbar"
    )
  );
}

// ── STREAK TAB ────────────────────────────────────────────────────
function StreakTab({streak,weekDone,onCheckin,lastCheckin}){
  const today=new Date().getDay(),todayCI=lastCheckin===new Date().toDateString();
  const milestones=[3,7,14,30,60,100],next=milestones.find(m=>m>streak)||100;
  return React.createElement('div',{style:{animation:"fadeUp .3s ease"}},
    // Hero
    React.createElement('div',{style:{...card(),textAlign:"center",marginBottom:12,padding:"28px 20px",background:"linear-gradient(160deg,#1a0a00,#120800)",border:"1px solid #f9731622"}},
      React.createElement('div',{style:{fontSize:56,animation:streak>0?"fireAnim 2s ease-in-out infinite":"none",display:"inline-block",marginBottom:8}},streak>0?"🔥":"💤"),
      React.createElement('div',{style:{fontSize:52,fontWeight:800,color:"#f97316",lineHeight:1}},streak),
      React.createElement('div',{style:{color:C.muted,fontSize:13,marginTop:6,marginBottom:16}},streak===1?"Tag Streak":"Tage Streak"),
      !todayCI
        ?React.createElement('button',{onClick:onCheckin,style:{...btn("linear-gradient(135deg,#f97316,#f59e0b)"),padding:"12px 28px",borderRadius:12,fontSize:14}},"✓ Heute einchecken  +50 XP")
        :React.createElement('div',{style:{background:"#10b98118",border:"1px solid #10b98144",borderRadius:10,padding:"10px 20px",color:"#10b981",fontSize:13,fontWeight:600,display:"inline-block"}},"✅ Heute eingecheckt")
    ),
    // Week
    React.createElement('div',{style:{...card(),marginBottom:12}},
      React.createElement('div',{style:{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.1em",marginBottom:12}},"DIESE WOCHE"),
      React.createElement('div',{style:{display:"flex",gap:6}},
        WEEK.map((d,i)=>{
          const done=weekDone[i],isToday=i===(today===0?6:today-1);
          return React.createElement('div',{key:d,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
            React.createElement('div',{style:{width:"100%",aspectRatio:"1",borderRadius:10,background:done?"linear-gradient(135deg,#f97316,#f59e0b)":isToday?C.surface:"transparent",border:`1px solid ${isToday?"#f97316":done?"transparent":C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,transition:"all .3s"}},done?"🔥":isToday?"·":""),
            React.createElement('div',{style:{fontSize:9,color:isToday?"#f97316":C.subtle,fontWeight:isToday?700:400}},d)
          );
        })
      )
    ),
    // Milestones
    React.createElement('div',{style:{...card()}},
      React.createElement('div',{style:{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.1em",marginBottom:12}},"MEILENSTEINE"),
      milestones.map(m=>{
        const reached=streak>=m,current=!reached&&m===next;
        return React.createElement('div',{key:m,style:{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${C.border}`,opacity:!reached&&!current?.5:1}},
          React.createElement('div',{style:{fontSize:18}},m<=3?"🥉":m<=7?"🥈":m<=14?"🥇":m<=30?"💎":m<=60?"🏆":"👑"),
          React.createElement('div',{style:{flex:1}},
            React.createElement('div',{style:{color:reached?"#f59e0b":current?"#f97316":C.text,fontSize:13,fontWeight:600}},`${m} Tage`),
            React.createElement('div',{style:{color:C.muted,fontSize:11,marginTop:1}},reached?"Erreicht! 🎉":current?`Noch ${m-streak} Tag(e)`:"-")
          ),
          reached&&React.createElement('div',{style:{width:20,height:20,borderRadius:"50%",background:"#10b98120",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}},"✓")
        );
      })
    )
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────
function App(){
  const[authChecked,setAuthChecked]=useState(false);
  const[user,setUser]=useState(null);
  const[showAuth,setShowAuth]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[tab,setTab]=useState(0);
  const[toast,setToast]=useState(null);
  const[lvlUp,setLvlUp]=useState(null);
  const[alarm,setAlarm]=useState(null);
  const[notifAsked,setNotifAsked]=useState(false);

  // data
  const[xp,setXP]=useState(0);
  const[level,setLevel]=useState(1);
  const[xpInLevel,setXpInLevel]=useState(0);
  const[todos,setTodos]=useState(DEFAULT().todos);
  const[workouts,setWorkouts]=useState(DEFAULT().workouts);
  const[health,setHealth]=useState(DEFAULT().health);
  const[streak,setStreak]=useState(0);
  const[lastCheckin,setLastCheckin]=useState(null);
  const[weekDone,setWeekDone]=useState(Array(7).fill(false));
  const[screenTime,setScreenTime]=useState({});
  const[reminders,setReminders]=useState([]);
  const[workoutHistory,setWorkoutHistory]=useState({});
  const[themeId,setThemeId]=useState("default");

  // form
  const[newText,setNewText]=useState("");
  const[newTime,setNewTime]=useState("09:00");
  const[newDuration,setNewDuration]=useState(15);
  const[newPri,setNewPri]=useState("mittel");
  const[newNotif,setNewNotif]=useState(true);
  const[newWorkout,setNewWorkout]=useState({name:"",sets:"",reps:"",dauer:""});
  const[editScreen,setEditScreen]=useState(null);
  const[scrUsed,setScrUsed]=useState("");
  const[scrLimit,setScrLimit]=useState("");

  const lvlRef=useRef(1),xpRef=useRef(0),firedAlarms=useRef(new Set());
  const hAwarded=useRef({wasser:false,schlaf:false,schritte:false,kalorien:false});
  const saveTimer=useRef(null);

  const snap=useCallback(()=>({xp,level,xpInLevel,todos,workouts,health,streak,lastCheckin,weekDone,screenTime,reminders,workoutHistory,themeId}),[xp,level,xpInLevel,todos,workouts,health,streak,lastCheckin,weekDone,screenTime,reminders,workoutHistory,themeId]);

  const applyData=d=>{
    if(!d)return;
    if(d.xp!=null){setXP(d.xp);}
    if(d.level!=null){setLevel(d.level);lvlRef.current=d.level;}
    if(d.xpInLevel!=null){setXpInLevel(d.xpInLevel);xpRef.current=d.xpInLevel;}
    if(d.todos)setTodos(d.todos);
    if(d.workouts)setWorkouts(d.workouts);
    if(d.health)setHealth(d.health);
    if(d.streak!=null)setStreak(d.streak);

            ),
            React.createElement('div',{style:{display:"flex",gap:8}},
              [-1,1].map(d=>React.createElement('button',{key:d,onClick:()=>setHealth(h=>({...h,[item.key]:Math.max(0,h[item.key]+d*item.step)})),style:{width:34,height:34,borderRadius:10,background:d>0?item.color+"22":"transparent",border:`1px solid ${item.color}44`,color:item.color,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}},d>0?"+":"−"))
            )
          ))
        ),

        // ── STREAK ──
        tab===3&&React.createElement(StreakTab,{streak,weekDone,onCheckin:checkin,lastCheckin}),

        // ── PROFIL ──
        tab===4&&React.createElement(React.Fragment,null,

          // Account
          React.createElement('div',{style:{...card(),display:"flex",alignItems:"center",gap:12,background:user?"linear-gradient(135deg,#052010,#071a0a)":"linear-gradient(135deg,#0a0f1e,#0f172a)",border:`1px solid ${user?"#10b98130":C.border}`}},
            React.createElement('div',{style:{fontSize:24}},user?"☁️":"💾"),
            React.createElement('div',{style:{flex:1}},
              React.createElement('div',{style:{color:C.text,fontSize:13,fontWeight:600}},user?user.email:"Kein Konto – Lokal"),
              React.createElement('div',{style:{color:C.muted,fontSize:11,marginTop:2}},user?"Daten auf allen Geräten":"Nur auf diesem Gerät")
            ),
            user
              ?React.createElement('button',{onClick:()=>window.__fb.signOut().then(()=>setUser(null)),style:{...btn("#f43f5e18"),border:"1px solid #f43f5e30",color:"#f43f5e",padding:"6px 10px",fontSize:11,borderRadius:8}},"Abmelden")
              :React.createElement('button',{onClick:()=>setShowAuth(true),style:{...btn(C.accent),padding:"6px 12px",fontSize:11,borderRadius:8}},"Konto erstellen")
          ),

          // Level card
          React.createElement('div',{style:{...card(),background:"linear-gradient(135deg,#0f1629,#111827)"}},
            React.createElement('div',{style:{display:"flex",alignItems:"center",gap:14,marginBottom:12}},
              React.createElement('div',{style:{fontSize:40}},["🌱","🔥","⚡","💪","🏆","👑"][Math.min(level-1,5)]),
              React.createElement('div',{},
                React.createElement('div',{style:{fontSize:22,fontWeight:800,color:C.text}},`Level ${level}`),
                React.createElement('div',{style:{color:"#f59e0b",fontSize:13,marginTop:2}},titleStr)
              )
            ),
            React.createElement(XPBar,{current:xpInLevel,max:xpNeeded,color:"linear-gradient(90deg,#f59e0b,#f43f5e)"}),
            React.createElement('div',{style:{color:C.muted,fontSize:11,marginTop:6}},`${xpInLevel} / ${xpNeeded} XP bis Level ${level+1}`)
          ),

          // Streak
          React.createElement('div',{style:{...card(),display:"flex",alignItems:"center",gap:12,background:"linear-gradient(135deg,#1a0a00,#120800)",border:"1px solid #f9731622"}},
            React.createElement('span',{style:{fontSize:28,animation:"fireAnim 2s ease-in-out infinite",display:"inline-block"}},"🔥"),
            React.createElement('div',{style:{flex:1}},
              React.createElement('div',{style:{color:"#f97316",fontSize:16,fontWeight:700}},`${streak} Tage Streak`),
              React.createElement('div',{style:{color:C.muted,fontSize:11,marginTop:2}},lastCheckin?"Heute eingecheckt ✓":"Noch nicht eingecheckt")
            )
          ),

          // Stats
          React.createElement('div',{style:card()},
            React.createElement('div',{style:{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.1em",marginBottom:12}},"STATISTIKEN"),
            [{label:"Gesamt XP",val:`${xp} XP`,color:"#f59e0b"},
             {label:"Aufgaben erledigt",val:todos.filter(t=>t.done).length,color:C.accent},
             {label:"Trainings",val:workouts.filter(w=>w.done).length,color:C.accent2},
             {label:"Streak",val:`${streak} Tage`,color:"#f97316"},
            ].map((s,i)=>React.createElement('div',{key:s.label,style:{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:i>0?10:0,marginTop:i>0?10:0,borderTop:i>0?`1px solid ${C.border}`:"none"}},
              React.createElement('div',{style:{color:C.muted,fontSize:13}},s.label),
              React.createElement('div',{style:{color:s.color,fontWeight:700,fontSize:14}},s.val)
            ))
          ),

          // Theme Picker
          React.createElement('div',{style:card()},
            React.createElement('div',{style:{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.1em",marginBottom:14}},"🎨 DESIGN ANPASSEN"),
            React.createElement('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
              THEMES.map(t=>React.createElement('button',{key:t.id,onClick:()=>{setThemeId(t.id);applyTheme(t.id);},style:{
                background:themeId===t.id?t.accent+"22":C.surface,
                border:`1px solid ${themeId===t.id?t.accent:C.border}`,
                borderRadius:10,padding:"10px 12px",cursor:"pointer",textAlign:"left",transition:"all .2s",
              }},
                React.createElement('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
                  React.createElement('div',{style:{width:12,height:12,borderRadius:"50%",background:`linear-gradient(135deg,${t.accent},${t.accent2})`}}),
                  React.createElement('div',{style:{width:12,height:12,borderRadius:"50%",background:t.accent2}})
                ),
                React.createElement('div',{style:{color:themeId===t.id?t.accent:C.text,fontSize:12,fontWeight:600}}),
                React.createElement('div',{style:{fontSize:11,color:themeId===t.id?t.accent:C.muted,fontWeight:themeId===t.id?700:400}},t.name),
                themeId===t.id&&React.createElement('div',{style:{fontSize:10,color:t.accent,marginTop:2,fontWeight:600}},"✓ Aktiv")
              ))
            )
          ),

          // XP Guide
          React.createElement('div',{style:card()},
            React.createElement('div',{style:{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.1em",marginBottom:12}},"XP ÜBERSICHT"),
            [["Aufgabe (hoch)","30 XP"],["Aufgabe (mittel)","20 XP"],["Aufgabe (niedrig)","10 XP"],["Übung","35 XP"],["Wasser-Ziel","50 XP"],["Schlaf-Ziel","40 XP"],["Schritt-Ziel","60 XP"],["Kalorien-Ziel","30 XP"],["Streak Check-in","50 XP"]]
            .map(([k,v],i)=>React.createElement('div',{key:k,style:{display:"flex",justifyContent:"space-between",paddingTop:i>0?8:0,marginTop:i>0?8:0,borderTop:i>0?`1px solid ${C.border}`:"none"}},
              React.createElement('span',{style:{color:C.muted,fontSize:12}},k),
              React.createElement('span',{style:{color:"#f59e0b",fontSize:12,fontWeight:600}},v)
            ))

      ),

      // ── BOTTOM NAV ──
      React.createElement('div',{style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",padding:"8px 0 20px"}},
        TABS.map((t,i)=>React.createElement('button',{key:t.id,onClick:()=>setTab(i),style:{flex:1,background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"6px 0",transition:"all .15s"}},
          React.createElement('div',{style:{fontSize:16,color:tab===i?getTabColors()[i]:C.subtle,transition:"all .15s"}},t.icon),
          React.createElement('div',{style:{fontSize:9,fontWeight:600,color:tab===i?getTabColors()[i]:C.subtle,letterSpacing:"0.05em"}},t.label)
        ))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
