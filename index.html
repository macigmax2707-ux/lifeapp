<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeApp 🌙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#020617;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;font-family:'DM Mono',monospace;}
  ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px;}
  input::placeholder,textarea::placeholder{color:#475569;}
  select option{background:#1e293b;color:#f1f5f9;}
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes streakFire{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes levelUp{0%{transform:scale(0.7);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes bellShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ──────────────────────────────────────────────────────────────────
// FIREBASE CONFIG — ersetze diese Werte mit deinen eigenen!
// Anleitung: https://console.firebase.google.com → Projekt erstellen
// → Web-App hinzufügen → Config kopieren
// ──────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "DEIN_API_KEY",
  authDomain:        "DEIN_PROJECT.firebaseapp.com",
  projectId:         "DEIN_PROJECT_ID",
  storageBucket:     "DEIN_PROJECT.appspot.com",
  messagingSenderId: "DEINE_SENDER_ID",
  appId:             "DEINE_APP_ID"
};

let app, auth, db;
let firebaseReady = false;

try {
  app  = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getFirestore(app);
  if (!firebaseConfig.apiKey.startsWith("DEIN")) {
    firebaseReady = true;
  }
} catch(e) {
  console.warn("Firebase nicht konfiguriert – nur lokaler Modus.");
}

window.__fb = { auth, db, firebaseReady,
  createUser: (email,pw) => createUserWithEmailAndPassword(auth,email,pw),
  signIn:     (email,pw) => signInWithEmailAndPassword(auth,email,pw),
  signOut:    ()         => signOut(auth),
  onAuth:     (cb)       => firebaseReady ? onAuthStateChanged(auth,cb) : ()=>{},
  saveData:   async (uid,data) => { if(!firebaseReady)return; await setDoc(doc(db,"users",uid),data); },
  loadData:   async (uid)      => { if(!firebaseReady)return null; const s=await getDoc(doc(db,"users",uid)); return s.exists()?s.data():null; },
};
</script>

// ── LOCAL STORAGE ──────────────────────────────────────
const LS_KEY = "lifeapp_data";
function loadLocal() {
  try { const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; } catch{ return null; }
}
function saveLocal(data) {
  try { localStorage.setItem(LS_KEY,JSON.stringify(data)); } catch{}
}

// ── SMALL HELPERS ──────────────────────────────────────
function sendNotif(title,body){
  if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
  try{new Notification(title,{body});}catch(e){}
}

function ProgressRing({value,max,color,size=80,label,unit}){
  const r=(size-12)/2,circ=2*Math.PI*r,pct=Math.min(value/max,1),offset=circ*(1-pct);
  return React.createElement('div',{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
    React.createElement('svg',{width:size,height:size},

      React.createElement('circle',{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:10,

}

// ── AUTH SCREEN ────────────────────────────────────────
function AuthScreen({onSkip}){
  const [mode,setMode]=useState("login"); // login | register
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [pw2,setPw2]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");

  const fb = window.__fb;
  const fbReady = fb?.firebaseReady;

  const handleSubmit=async()=>{
    setError(""); setSuccess("");
    if(!email||!pw){setError("Bitte E-Mail und Passwort eingeben.");return;}
    if(mode==="register"&&pw!==pw2){setError("Passwörter stimmen nicht überein.");return;}
    if(pw.length<6){setError("Passwort muss mindestens 6 Zeichen haben.");return;}
    setLoading(true);
    try{
      if(mode==="register") await fb.createUser(email,pw);
      else await fb.signIn(email,pw);
      setSuccess(mode==="register"?"Konto erstellt! Willkommen!":"Angemeldet!");
    }catch(e){
      const msgs={
        "auth/email-already-in-use":"Diese E-Mail ist bereits registriert.",
        "auth/invalid-email":"Ungültige E-Mail-Adresse.",
        "auth/wrong-password":"Falsches Passwort.",
        "auth/user-not-found":"Kein Konto mit dieser E-Mail.",
        "auth/network-request-failed":"Netzwerkfehler. Prüfe deine Verbindung.",
      };
      setError(msgs[e.code]||"Fehler: "+e.message);
    }
    setLoading(false);
  };

  const inp={background:"#0f172a",border:"1px solid #334155",borderRadius:10,padding:"12px 14px",
    color:"#f1f5f9",fontSize:14,outline:"none",width:"100%",fontFamily:"'DM Mono',monospace",marginBottom:10};

  return React.createElement('div',{style:{width:"100%",maxWidth:480,minHeight:"100vh",
    background:"linear-gradient(160deg,#0f172a,#1e293b)",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",padding:"32px 24px",margin:"0 auto"}},

    React.createElement('div',{style:{fontSize:48,marginBottom:8}},"🌙"),
    React.createElement('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:"#f8fafc",marginBottom:4}},"LifeApp"),
    React.createElement('div',{style:{fontSize:12,color:"#475569",marginBottom:32}},"Dein persönlicher Lebens-Tracker"),

    !fbReady&&React.createElement('div',{style:{background:"#f9731622",border:"1px solid #f9731644",borderRadius:12,padding:"12px 16px",marginBottom:20,width:"100%"}},
      React.createElement('div',{style:{color:"#f97316",fontSize:12,fontWeight:700,marginBottom:4}},"Firebase nicht konfiguriert"),
      React.createElement('div',{style:{color:"#94a3b8",fontSize:11,lineHeight:1.6}},"Öffne die HTML-Datei und trage deine Firebase-Daten ein. Bis dahin: lokal fortfahren.")
    ),

    React.createElement('div',{style:{width:"100%",background:"#1e293b",borderRadius:20,padding:"24px",border:"1px solid #334155"}},
      React.createElement('div',{style:{display:"flex",gap:8,marginBottom:20}},
        ["login","register"].map(m=>React.createElement('button',{key:m,onClick:()=>{setMode(m);setError("");},style:{
          flex:1,background:mode===m?"linear-gradient(135deg,#818cf8,#22d3ee)":"#0f172a",
          color:mode===m?"#fff":"#475569",border:mode===m?"none":"1px solid #334155",
          borderRadius:10,padding:"10px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Mono',monospace",
        }},m==="login"?"Anmelden":"Registrieren"))
      ),

      React.createElement('input',{style:inp,type:"email",placeholder:"E-Mail",value:email,onChange:e=>setEmail(e.target.value)}),
      React.createElement('input',{style:inp,type:"password",placeholder:"Passwort (min. 6 Zeichen)",value:pw,onChange:e=>setPw(e.target.value)}),
      mode==="register"&&React.createElement('input',{style:inp,type:"password",placeholder:"Passwort wiederholen",value:pw2,onChange:e=>setPw2(e.target.value)}),

      error&&React.createElement('div',{style:{color:"#f43f5e",fontSize:12,marginBottom:10,padding:"8px 12px",background:"#f43f5e11",borderRadius:8}},error),

      React.createElement('button',{onClick:handleSubmit,disabled:loading||!fbReady,style:{
        width:"100%",background:fbReady?"linear-gradient(135deg,#818cf8,#22d3ee)":"#334155",
        color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:700,
        cursor:fbReady?"pointer":"not-allowed",fontFamily:"'DM Mono',monospace",marginBottom:12,
        display:"flex",alignItems:"center",justifyContent:"center",gap:8,
      }},
        loading&&React.createElement('div',{style:{width:16,height:16,border:"2px solid #ffffff44",borderTop:"2px solid #fff",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}),

      React.createElement('div',{style:{textAlign:"center"}}),

// ── STREAK TAB ────────────────────────────────────────

      React.createElement('div',{style:{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 0%,#f9731611,transparent 70%)",pointerEvents:"none"}}),

      React.createElement('div',{style:{color:"#94a3b8",fontSize:13,marginTop:4}},streak===1?"Tag Streak":"Tage Streak"),
      streak>0&&React.createElement('div',{style:{color:"#f59e0b",fontSize:11,marginTop:6}},`Nächster Meilenstein: ${next} Tage 🏆`),
      React.createElement('div',{style:{marginTop:16}},
        !todayCI
          ?React.createElement('button',{onClick:onCheckin,style:{background:"linear-gradient(135deg,#f97316,#f59e0b)",color:"#fff",border:"none",borderRadius:14,padding:"12px 28px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Mono',monospace"}},"✓ Heute einchecken +50 XP")
          :React.createElement('div',{style:{background:"#22d3ee22",border:"1px solid #22d3ee44",borderRadius:12,padding:"10px 20px",color:"#22d3ee",fontSize:13,fontWeight:700}},"✅ Heute eingecheckt!")
      )
    ),
    React.createElement('div',{style:{marginBottom:16}},
      React.createElement('div',{style:{fontSize:10,color:"#475569",letterSpacing:"0.15em",marginBottom:10,textTransform:"uppercase"}},"Diese Woche"),
      React.createElement('div',{style:{display:"flex",gap:6}},
        WEEK_DAYS.map((d,i)=>{
          const done=weekDone[i],isToday=i===(today===0?6:today-1);

            React.createElement('div',{style:{fontSize:9,color:isToday?"#f97316":"#475569"}},d)
          );
        })
      )
    ),
    milestones.map(m=>{
      const reached=streak>=m,current=!reached&&m===next;
      return React.createElement('div',{key:m,style:{background:reached?"#1a1a0a":"#1e293b",border:reached?"1px solid #f59e0b44":current?"1px solid #f9731644":"1px solid #334155",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:12,marginBottom:8}},
        React.createElement('div',{style:{fontSize:20}},m<=3?"🥉":m<=7?"🥈":m<=14?"🥇":m<=30?"💎":m<=60?"🏆":"👑"),
        React.createElement('div',{style:{flex:1}},
          React.createElement('div',{style:{color:reached?"#f59e0b":current?"#f97316":"#64748b",fontSize:13,fontWeight:700}},`${m} Tage Streak`),
          React.createElement('div',{style:{fontSize:10,color:"#475569",marginTop:1}},reached?"Erreicht! 🎉":current?`Noch ${m-streak} Tag(e)`:`${m} Tage am Stück`)
        ),
        reached&&React.createElement('div',{style:{fontSize:18}},"✅")
      );

  );

// ── SCREEN TIME TAB ───────────────────────────────────
function ScreenTimeTab({screenTime,setScreenTime,onXP}){
  const [editApp,setEditApp]=useState(null),[iv,setIv]=useState(""),[lv,setLv]=useState("");
  const totalUsed=APPS.reduce((s,a)=>s+(screenTime[a.id]?.used||0),0);
  const totalLimit=APPS.reduce((s,a)=>s+(screenTime[a.id]?.limit||a.limit),0);
  const over=APPS.filter(a=>(screenTime[a.id]?.used||0)>(screenTime[a.id]?.limit||a.limit));
  const fmt=m=>m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`;
  const save=()=>{
    const used=Math.max(0,parseInt(iv)||0),limit=Math.max(1,parseInt(lv)||30);
    const aa=screenTime[editApp.id]?.awarded,isUnder=used<=limit&&used>0;
    setScreenTime(p=>({...p,[editApp.id]:{used,limit,awarded:aa||isUnder}}));
    if(isUnder&&!aa)onXP(25,`${editApp.name} Limit eingehalten 📱`);
    setEditApp(null);
  };
  return React.createElement('div',{style:{animation:"fadeIn 0.3s ease"}},
    React.createElement('div',{style:{background:"linear-gradient(135deg,#0a001a,#160d2a)",border:"1px solid #a78bfa33",borderRadius:20,padding:"20px",marginBottom:16}},
      React.createElement('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
        React.createElement('div',{},
          React.createElement('div',{style:{fontSize:11,color:"#475569",letterSpacing:"0.1em",textTransform:"uppercase"}},"Bildschirmzeit heute"),
          React.createElement('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:32,fontWeight:800,color:"#a78bfa",marginTop:4}},fmt(totalUsed)),
          React.createElement('div',{style:{fontSize:11,color:"#475569",marginTop:2}},`Limit: ${fmt(totalLimit)}`)

    if(!data)return;

    if(data.xpInLevel!==undefined){setXpInLevel(data.xpInLevel);xpInLevelRef.current=data.xpInLevel;}

  // ── Firebase auth listener ──
  useEffect(()=>{

          // Try to load cloud data
          try{
            const cloud=await fb.loadData(u.uid);
            if(cloud) applyData(cloud);
            else {
              // First login: upload local data
              const local=loadLocal();
              if(local){applyData(local);await fb.saveData(u.uid,local);}
            }
          }catch(e){console.warn("Cloud load error",e);}

                React.createElement('input',{style:{...S.inp,width:"40%"},placeholder:"Dauer",value:newWorkout.dauer,onChange:e=>setNewWorkout({...newWorkout,dauer:e.target.value})})
              ),
              React.createElement('button',{style:S.btn("#22d3ee"),onClick:()=>{if(!newWorkout.name.trim())return;setWorkouts(prev=>[...prev,{id:Date.now(),...newWorkout,done:false}]);setNewWorkout({name:"",sets:"",reps:"",dauer:""});}},"+ Übung hinzufügen")
            )
          ),
          React.createElement('div',{style:S.sec},
            React.createElement('div',{style:S.sLabel},`Training (${workouts.filter(w=>w.done).length}/${workouts.length})`),
            React.createElement('div',{style:{background:"#0f172a",borderRadius:8,height:6,marginBottom:12,overflow:"hidden"}},
              React.createElement('div',{style:{height:"100%",borderRadius:8,background:"linear-gradient(90deg,#22d3ee,#818cf8)",width:`${workouts.length?(workouts.filter(w=>w.done).length/workouts.length)*100:0}%`,transition:"width 0.4s ease"}})
            ),
            workouts.map(w=>React.createElement('div',{key:w.id,style:{...S.card,opacity:w.done?.5:1}},
              React.createElement('div',{onClick:()=>{if(w.done)return;setWorkouts(prev=>prev.map(x=>x.id===w.id?{...x,done:true}:x));awardXP(XP_TABLE.workout_done,w.name+" ⚡");},style:{width:22,height:22,borderRadius:6,background:w.done?"#22d3ee":"transparent",border:w.done?"none":"2px solid #22d3ee",flexShrink:0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#0f172a"}},w.done?"✓":""),
              React.createElement('div',{style:{flex:1}},
                React.createElement('div',{style:{color:"#f1f5f9",fontSize:13,textDecoration:w.done?"line-through":"none"}},w.name),
                React.createElement('div',{style:{color:"#64748b",fontSize:11}},`${w.sets?w.sets+"×":""}${w.reps||""}${w.dauer?" · "+w.dauer:""}`,!w.done&&React.createElement('span',{style:{color:"#22d3ee"}},` +${XP_TABLE.workout_done}XP`))
              ),
              React.createElement('span',{onClick:()=>setWorkouts(prev=>prev.filter(x=>x.id!==w.id)),style:{color:"#475569",cursor:"pointer",fontSize:16}},"×")
            ))
          )
        ),

        // GESUNDHEIT
        tab===2&&React.createElement('div',{style:{animation:"fadeIn 0.3s ease"}},
          React.createElement('div',{style:S.sec},
            React.createElement('div',{style:S.sLabel},"Tagesübersicht"),
            React.createElement('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
              React.createElement(ProgressRing,{value:health.wasser,max:8,color:"#22d3ee",label:"Wasser",unit:"/ 8 Gl."}),
              React.createElement(ProgressRing,{value:health.schlaf,max:8,color:"#818cf8",label:"Schlaf",unit:"/ 8 Std."}),
              React.createElement(ProgressRing,{value:health.schritte,max:10000,color:"#f59e0b",label:"Schritte",unit:"/ 10k"}),
              React.createElement(ProgressRing,{value:health.kalorien,max:2000,color:"#f43f5e",label:"Kalorien",unit:"/ 2000"})
            )
          ),
          [{key:"wasser",label:"💧 Wasser",unit:"Gläser",step:1,color:"#22d3ee",goal:8,xpKey:"wasser_ziel"},
           {key:"schlaf",label:"🌙 Schlaf",unit:"Stunden",step:1,color:"#818cf8",goal:8,xpKey:"schlaf_ziel"},
           {key:"schritte",label:"👟 Schritte",unit:"Schritte",step:1000,color:"#f59e0b",goal:10000,xpKey:"schritte_ziel"},
           {key:"kalorien",label:"🔥 Kalorien",unit:"kcal",step:100,color:"#f43f5e",goal:2000,xpKey:"kalorien_ok"},
          ].map(item=>React.createElement('div',{key:item.key,style:{...S.card,justifyContent:"space-between"}},
            React.createElement('div',{},
              React.createElement('div',{style:{color:"#f1f5f9",fontSize:13}},item.label),
              React.createElement('div',{style:{color:item.color,fontSize:18,fontWeight:700,marginTop:2}},health[item.key],React.createElement('span',{style:{fontSize:11,color:"#64748b"}},` ${item.unit}`)),
              health[item.key]<item.goal?React.createElement('div',{style:{fontSize:10,color:"#475569"}},`Ziel: ${item.goal} → +${XP_TABLE[item.xpKey]}XP`):React.createElement('div',{style:{fontSize:10,color:"#22d3ee"}},"✓ Ziel erreicht!")
            ),
            React.createElement('div',{style:{display:"flex",gap:8}},
              [-1,1].map(d=>React.createElement('button',{key:d,onClick:()=>setHealth(h=>({...h,[item.key]:Math.max(0,h[item.key]+d*item.step)})),style:{background:"#0f172a",color:item.color,border:`1px solid ${item.color}`,borderRadius:8,width:32,height:32,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},d>0?"+":"−"))
            )
          ))
        ),

        tab===3&&React.createElement(StreakTab,{streak,weekDone,onCheckin:handleCheckin,lastCheckin}),
        tab===4&&React.createElement(ScreenTimeTab,{screenTime,setScreenTime,onXP:awardXP}),

        // PROFIL
        tab===5&&React.createElement('div',{style:{animation:"fadeIn 0.3s ease"}},
          // Account card
          React.createElement('div',{style:{background:user?"linear-gradient(135deg,#0a1a0a,#0f2a0f)":"linear-gradient(135deg,#1e293b,#0f172a)",border:`1px solid ${user?"#22d3ee44":"#334155"}`,borderRadius:16,padding:"16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}},
            React.createElement('div',{style:{fontSize:28}},user?"☁️":"💾"),
            React.createElement('div',{style:{flex:1}},
              React.createElement('div',{style:{color:"#f1f5f9",fontSize:13,fontWeight:700}},user?`Angemeldet als ${user.email}`:"Kein Konto – Lokal gespeichert"),
              React.createElement('div',{style:{color:"#64748b",fontSize:11,marginTop:2}},user?"Daten auf allen Geräten verfügbar":"Nur auf diesem Gerät")
            ),
            user
              ?React.createElement('button',{onClick:handleSignOut,style:{background:"#f43f5e22",color:"#f43f5e",border:"1px solid #f43f5e44",borderRadius:8,padding:"6px 10px",fontSize:10,cursor:"pointer",fontFamily:"'DM Mono',monospace"}},"Abmelden")
              :React.createElement('button',{onClick:()=>setShowAuth(true),style:{background:"linear-gradient(135deg,#818cf8,#22d3ee)",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"'DM Mono',monospace"}},"Konto erstellen")
          ),

          React.createElement('div',{style:{...S.card,background:"linear-gradient(135deg,#1e293b,#0f172a)",marginBottom:16,flexDirection:"column",alignItems:"flex-start",gap:8}},
            React.createElement('div',{style:{display:"flex",alignItems:"center",gap:12,width:"100%"}},
              React.createElement('div',{style:{fontSize:36}},["🌱","🔥","⚡","💪","🏆","👑"][Math.min(level-1,5)]),
              React.createElement('div',{style:{flex:1}},
                React.createElement('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,color:"#f1f5f9"}},`Level ${level}`),
                React.createElement('div',{style:{color:"#f59e0b",fontSize:12}},titleStr)
              )
            ),
            React.createElement('div',{style:{width:"100%",background:"#0f172a",borderRadius:8,height:8,overflow:"hidden"}},
              React.createElement('div',{style:{height:"100%",borderRadius:8,background:"linear-gradient(90deg,#f59e0b,#f43f5e)",width:`${xpPct}%`,transition:"width 0.6s ease"}})
            ),
            React.createElement('div',{style:{fontSize:10,color:"#64748b"}},`${xpInLevel} / ${xpNeeded} XP bis Level ${level+1}`)
          ),

          React.createElement('div',{style:{...S.card,background:"linear-gradient(135deg,#1a0a00,#2d1200)",border:"1px solid #f9731644",marginBottom:16}},
            React.createElement('span',{style:{fontSize:24}},"🔥"),
            React.createElement('div',{style:{flex:1}},
              React.createElement('div',{style:{color:"#f97316",fontSize:14,fontWeight:700}},`${streak} Tage Streak`),
              React.createElement('div',{style:{color:"#64748b",fontSize:11,marginTop:1}},lastCheckin?"Heute eingecheckt":"Noch kein Check-in")
            )
          ),

          React.createElement('div',{style:S.sec},
            React.createElement('div',{style:S.sLabel},"Statistiken"),
            [{label:"Gesamt XP",val:`${xp} XP`,color:"#f59e0b"},
             {label:"Aufgaben erledigt",val:`${todos.filter(t=>t.done).length}`,color:"#818cf8"},
             {label:"Trainings",val:`${workouts.filter(w=>w.done).length}`,color:"#22d3ee"},
             {label:"Streak",val:`${streak} Tage`,color:"#f97316"},
            ].map(s=>React.createElement('div',{key:s.label,style:{...S.card,justifyContent:"space-between"}},
              React.createElement('div',{style:{color:"#94a3b8",fontSize:13}},s.label),
              React.createElement('div',{style:{color:s.color,fontWeight:700,fontSize:14}},s.val)
            ))
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
