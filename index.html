// ── SERVICE WORKER + PWA ──────────────────────────────

// ── NOTIFICATION HELPERS ───────────────────────────────
async function requestNotifPermission(){
  if(typeof Notification==="undefined")return false;
  if(Notification.permission==="granted")return true;
  const p=await Notification.requestPermission();
  return p==="granted";
}

function scheduleAlarmsInSW(todos){
  if(!navigator.serviceWorker?.controller)return;
  navigator.serviceWorker.controller.postMessage({type:"SCHEDULE_ALARMS",todos});
}

function sendLocalNotif(title,body){
  if(typeof Notification==="undefined"||Notification.permission!=="granted")return;

// ── AUTH SCREEN ────────────────────────────────────────
function AuthScreen({onSkip,accent}){
  const[mode,setMode]=useState("login");
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[pw2,setPw2]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const submit=async()=>{
    setError("");
    if(!email||!pw){setError("Bitte E-Mail und Passwort eingeben.");return;}
    if(mode==="register"&&pw!==pw2){setError("Passwörter stimmen nicht überein.");return;}
    if(pw.length<6){setError("Passwort: mindestens 6 Zeichen.");return;}
    setLoading(true);
    try{
      if(mode==="register")await window.__fb.createUser(email,pw);
      else await window.__fb.signIn(email,pw);
    }catch(e){
      const m={"auth/email-already-in-use":"E-Mail bereits registriert.","auth/invalid-email":"Ungültige E-Mail.","auth/wrong-password":"Falsches Passwort.","auth/user-not-found":"Kein Konto gefunden.","auth/invalid-credential":"E-Mail oder Passwort falsch."};
      setError(m[e.code]||"Fehler: "+e.message);
    }
    setLoading(false);
  };

  const s={background:"#0f172a",border:"1px solid #1e2d3d",borderRadius:10,padding:"10px 14px",color:"#f1f5f9",fontSize:13,outline:"none",width:"100%"};
  return React.createElement('div',{style:{width:"100%",maxWidth:420,minHeight:"100vh",margin:"0 auto",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 20px",background:"#080c14"}},

      React.createElement('div',{style:{display:"flex",background:"#0f172a",borderRadius:10,padding:3,marginBottom:20}},
        ["login","register"].map(m=>React.createElement('button',{key:m,onClick:()=>{setMode(m);setError("");},style:{flex:1,background:mode===m?accent:"transparent",color:mode===m?"#fff":"#64748b",border:"none",borderRadius:8,padding:"8px",fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .2s"}},m==="login"?"Anmelden":"Registrieren"))

      React.createElement('div',{style:{display:"flex",gap:6}},
